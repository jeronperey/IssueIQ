services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: issueiq-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      # Listener wiring
      # EXTERNAL (9092): host-side scripts connect via localhost:9092
      # INTERNAL (29092): Docker services connect via kafka:29092
      - KAFKA_LISTENERS=EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

      # Fixed cluster ID prevents metadata mismatch after volume wipe
      - CLUSTER_ID=YWJjZGVmZ2hpamtsbW5vcA==
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - issueiq-net

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: issueiq-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - issueiq-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: issueiq-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - issueiq-net

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: issueiq-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-issues --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic normalized-issues --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic dead-letter --partitions 1 --replication-factor 1
      echo 'topics ready'
      "
    networks:
      - issueiq-net

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: issueiq-ingestion
    ports:
      - "8080:8080"
    environment:
      - KAFKA_ADDR=kafka:29092
      - KAFKA_TOPIC=raw-issues
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - issueiq-net

networks:
  issueiq-net:
    driver: bridge

volumes:
  opensearch-data: